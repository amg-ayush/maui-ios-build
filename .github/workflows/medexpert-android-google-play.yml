name: Android - Google Play Closed Testing

on:
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish Android
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # SSH / Gitea
      # ------------------------------------------------------------

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEA_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p 2222 git2.ipcbc.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Clone MedExpert
        run: |
          git clone \
            --depth 1 \
            --branch "${{ vars.TARGET_BRANCH }}" \
            --progress \
            ssh://git@git2.ipcbc.com:2222/IPCBC/MedExpert.git \
            MedExpert

      - name: Check repository
        working-directory: MedExpert
        run: |
          echo "=== Branch ==="
          git branch --show-current

          echo ""
          echo "=== Commit ==="
          git log -1 --oneline

          echo ""
          echo "=== Status ==="
          git status

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/android.keystore"

      - name: Restore MedExpert Android
        working-directory: MedExpert
        run: |
          dotnet restore \
            MedExpert.Mobile/App/MedExpert.Mobile.App.csproj \
            -p:Configuration=Release \
            -p:TargetFramework=net10.0-android

      - name: Publish signed AAB
        working-directory: MedExpert
        run: |
          dotnet publish MedExpert.Mobile/App/MedExpert.Mobile.App.csproj \
            -f net10.0-android \
            -c Release \
            --no-restore \
            -p:AndroidPackageFormats=aab \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="${{ github.workspace }}/android.keystore" \
            -p:AndroidSigningKeyAlias="${{ vars.ANDROID_KEY_ALIAS }}" \
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Find signed AAB
        id: find_aab
        shell: bash
        run: |
          AAB_PATH=$(find MedExpert/MedExpert.Mobile/App/bin/Release/net10.0-android \
            -name "*-signed.aab" \
            -type f \
            | head -n 1)

          if [ -z "$AAB_PATH" ]; then
            echo "Signed AAB not found."
            exit 1
          fi

          echo "Found AAB: $AAB_PATH"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: medexpert-android-aab
          path: ${{ steps.find_aab.outputs.aab_path }}

      - name: Upload to Google Play Closed Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: ${{ steps.find_aab.outputs.aab_path }}
          track: ${{ vars.GOOGLE_PLAY_TRACK }}
          status: completed
