name: Build MedExpert iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # ------------------------------------------------------------
      # SSH / Gitea
      # ------------------------------------------------------------

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEA_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p 2222 git2.ipcbc.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Clone MedExpert
        run: |
          git clone \
            --depth 1 \
            --branch maui_10 \
            --progress \
            ssh://git@git2.ipcbc.com:2222/IPCBC/MedExpert.git \
            MedExpert

      - name: Check repository
        working-directory: MedExpert
        run: |
          echo "=== Branch ==="
          git branch --show-current

          echo ""
          echo "=== Commit ==="
          git log -1 --oneline

          echo ""
          echo "=== Status ==="
          git status

      # ------------------------------------------------------------
      # Xcode
      # ------------------------------------------------------------

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select \
            --switch /Applications/Xcode_26.6.app/Contents/Developer

          echo "=== macOS ==="
          sw_vers

          echo ""
          echo "=== Xcode ==="
          xcodebuild -version

          echo ""
          echo "=== Developer directory ==="
          xcode-select -p

      # ------------------------------------------------------------
      # .NET
      # ------------------------------------------------------------

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Check .NET
        run: |
          echo "=== .NET SDK ==="
          dotnet --version

          echo ""
          echo "=== .NET info ==="
          dotnet --info

      # ------------------------------------------------------------
      # MAUI / iOS workloads
      # ------------------------------------------------------------

      - name: Install MAUI workload for Xcode 26.6
        run: |
          dotnet workload install maui ios \
            --version 10.0.401

      - name: Check installed workloads
        run: |
          echo "=== Workload info ==="
          dotnet workload --info

          echo ""
          echo "=== Workload list ==="
          dotnet workload list

      # ------------------------------------------------------------
      # NuGet restore
      # ------------------------------------------------------------

      - name: Restore MedExpert.Mobile
        working-directory: MedExpert
        run: |
          dotnet restore \
            MedExpert.Mobile/App/MedExpert.Mobile.App.csproj

      # ------------------------------------------------------------
      # Build MedExpert iOS
      # ------------------------------------------------------------

      - name: Build MedExpert iOS
        working-directory: MedExpert
        run: |
          dotnet build \
            MedExpert.Mobile/App/MedExpert.Mobile.App.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            --no-restore
