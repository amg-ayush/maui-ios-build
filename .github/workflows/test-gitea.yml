name: Test Gitea clone

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEA_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p 2222 git2.ipcbc.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH authentication
        run: |
          ssh -T -p 2222 git@git2.ipcbc.com || true

      - name: Clone MedExpert
        run: |
          git clone \
            --depth 1 \
            --branch maui_10 \
            ssh://git@git2.ipcbc.com:2222/IPCBC/MedExpert.git \
            MedExpert

      - name: Check repository
        run: |
          cd MedExpert
          git status
          git remote -v
          git log -1 --oneline
